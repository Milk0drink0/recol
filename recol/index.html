<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Serif+Display&family=Playfair+Display:wght@400;600;700&family=Fraunces:wght@400;600;700&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#E2513A; --red:#C9363A; --link:#6BBFE0; --doc:#EB9A5A; --squig:#5A3510;
  --paper:#F5F3EF; --bar:#E9E5DF; --line:#D9D3CB; --ink:#1E1E1E; --soft:#6A625B; --muted:#B5B5B5; --faint:#958d86;
  --panel:#FFFFFF; --panel-line:#C9C9C9; --input-line:#E3E0DB; --hover:rgba(0,0,0,.05); --chip:#F5F3EF;
  --rbtn:rgba(245,243,239,.94); --toast-bg:#1E1E1E; --toast-fg:#FFFFFF;
  --font:"Saira Semi Condensed","Avenir Next Condensed",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#1B1918; --bar:#252220; --line:#36312E; --ink:#F2EEEA; --soft:#ADA59E; --muted:#5A544F; --faint:#8A827B;
  --panel:#2A2725; --panel-line:#45403C; --input-line:#45403C; --hover:rgba(255,255,255,.06); --chip:#35312E;
  --rbtn:rgba(42,39,37,.94); --toast-bg:#F2EEEA; --toast-fg:#1B1918;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{color:var(--ink);background:transparent}
body.dragging,body.dragging *{cursor:grabbing!important}

/* ---------- toolbar (sits under the real macOS traffic lights) ---------- */
.toolbar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 14px;background:var(--bar);border-bottom:1px solid var(--line)}
.native .toolbar{padding-left:86px}
.native.fullscreen .toolbar{padding-left:14px}
.web-mark{width:26px;height:26px;flex:none;margin-right:6px;fill:var(--paper);stroke:var(--brand);stroke-width:6}
.native .web-mark{display:none}
.boards{display:flex;gap:4px;overflow-x:auto;min-width:0;scrollbar-width:none;padding:2px}
.boards::-webkit-scrollbar{display:none}
.board-tab{flex:none;display:flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--soft);
  border-radius:8px;padding:4px 12px;font-size:15px;font-weight:500;white-space:nowrap}
.board-tab:hover{background:var(--hover)}
.board-tab.active{color:#fff}
.boards > .pill{background:var(--brand);border-radius:8px;transition:transform .6s cubic-bezier(.4,1.9,.45,.8),width .6s cubic-bezier(.4,1.9,.45,.8),opacity .2s}
.board-tab{animation:tabIn .4s cubic-bezier(.34,1.56,.64,1)}
.boards.settled .board-tab{animation:none}
.board-tab .lk{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;opacity:.85}
.board-tab.drop{box-shadow:inset 0 0 0 2px var(--brand);transform:scale(1.08);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.drop-new{display:none;flex:none;align-items:center;gap:6px;height:28px;padding:0 12px;margin-left:4px;border:2px dashed var(--line);border-radius:9px;color:var(--faint);font-size:14px;font-weight:600;white-space:nowrap;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),border-color .2s,color .2s,background .2s}
body.dragging .drop-new{display:flex;animation:tabIn .35s cubic-bezier(.34,1.56,.64,1)}
.drop-new.hot{border-color:var(--brand);color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);transform:scale(1.08)}
.bar-ghost{position:fixed;z-index:99;pointer-events:none;background:var(--brand);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translate(12px,10px);animation:pop .25s cubic-bezier(.34,1.56,.64,1)}
.mode-seg .clipi{width:10px;height:12px;flex:none}
#lockBtn.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,transparent)}
body.locked .clip{cursor:grab}
.sel-bar{position:fixed;z-index:43;display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--panel-line);border-radius:11px;padding:3px 4px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:pop .22s cubic-bezier(.34,1.56,.64,1)}
.sel-bar[hidden],body.dragging .sel-bar{display:none}
.sel-bar select,.note-bar select{font:inherit;font-size:13px;border:0;border-radius:7px;background:var(--hover);color:inherit;padding:3px 6px;max-width:130px;cursor:pointer;outline:0}
.sel-bar .lbl{font-size:12px;font-weight:600;color:var(--faint);padding-left:6px}
/* tags */
.clip.tagged.t-image,.clip.tagged.t-video{box-shadow:0 0 0 4px var(--tag)}
.tagchips{position:absolute;left:8px;bottom:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 50px);pointer-events:none;z-index:2}
.tagchip{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 8px 1px 6px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;white-space:nowrap}
.tagchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
body.mood .tagchips{display:none}
.clip.v-list .tagchip{display:inline-flex;margin-left:6px;vertical-align:1px;background:var(--chip);color:var(--soft)}
.tagpick{min-width:250px}
.tagpick .trow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 8px;border-radius:9px;font-size:15px;font-weight:500;text-align:left}
.tagpick .trow:hover{background:var(--hover)}
.tagpick .trow .dot{position:relative;width:16px;height:16px;border-radius:50%;flex:none;cursor:pointer}
.tagpick .trow .dot input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.tagpick .trow span{flex:1}
.tagpick .trow .ck{color:var(--brand);font-weight:800;width:14px}
.tagpick .trow .del{opacity:0;color:var(--faint);font-size:14px;padding:0 4px}
.tagpick .trow:hover .del{opacity:1}
.tagpick form{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.tagpick form .r{display:flex;gap:6px}
.tagpick form input[type=text]{flex:1;font:inherit;font-size:15px;border:2px solid var(--input-line);border-radius:9px;padding:4px 8px;outline:0;background:var(--panel);user-select:text;-webkit-user-select:text}
.tagpick form input[type=text]:focus{border-color:var(--brand)}
.tagpick form button{border:0;background:var(--brand);color:#fff;border-radius:9px;padding:4px 12px;font-weight:600}
.tagpick .tsw{display:flex;gap:6px;flex-wrap:wrap}
.tagpick .tsw button{width:20px;height:20px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tagpick .tsw button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.org-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.org-tags button{display:flex;align-items:center;gap:6px;border:2px solid var(--input-line);background:var(--panel);border-radius:999px;padding:2px 10px 2px 7px;font-size:14px;font-weight:500;color:var(--soft);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.org-tags button i{width:10px;height:10px;border-radius:50%}
.org-tags button.on{border-color:var(--ink);color:var(--ink);transform:scale(1.05)}
.org-tags .hint{font-size:13px;color:var(--faint)}
.snap-row span{cursor:default}
.board-tab .x{width:16px;height:16px;margin:0 -6px 0 2px;border-radius:5px;display:grid;place-items:center;opacity:0;font-size:13px;line-height:1;transition:opacity .15s,background .15s}
.board-tab:hover .x{opacity:.65}
.board-tab .x:hover{opacity:1;background:rgba(0,0,0,.18)}
.board-tab .pin-i{width:12px;height:12px;fill:currentColor;opacity:.85}
.board-tab input{font:inherit;color:inherit;background:none;border:0;outline:0;width:11ch;padding:0}
.tb-btn{flex:none;border:0;background:transparent;height:32px;min-width:32px;border-radius:8px;color:var(--soft);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;font-size:14px;font-weight:500}
.tb-btn:hover{background:var(--hover);color:var(--ink)}
.tb-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drag-space{flex:1;align-self:stretch;min-width:20px}

/* ---------- stage ---------- */
.stage{flex:1;min-height:0;position:relative}
.canvas{position:absolute;inset:0;overflow:auto;z-index:0;isolation:isolate;--gridc:color-mix(in srgb,var(--ink) 20%,transparent)}
/* free view is an infinite canvas: the surface is moved and scaled by the camera instead of scrolled */
.canvas.cam{overflow:hidden}
.canvas.cam .surface{position:absolute;left:0;top:0;width:100%;height:100%;min-width:0;min-height:0;transform-origin:0 0}
.canvas.cam-anim .surface{transition:transform .42s cubic-bezier(.22,1,.36,1)}
.canvas.grab,.canvas.grab *{cursor:grab!important}
.canvas.panning,.canvas.panning *{cursor:grabbing!important}
.canvas[data-grid=dots]{background-image:radial-gradient(circle at 1px 1px,var(--gridc) 1.15px,transparent 1.7px);background-size:var(--gs) var(--gs)}
.canvas[data-grid=lines]{--gridc:color-mix(in srgb,var(--ink) 9%,transparent);background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:var(--gs) var(--gs)}
.zoom-box{position:absolute;right:82px;bottom:26px;z-index:40;display:flex;gap:6px;transition:opacity .25s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.zoom-box.off{opacity:0;transform:translateY(10px) scale(.85);pointer-events:none}
.zoom-box .center-btn{width:30px;height:28px;border:0;border-radius:999px;background:var(--rbtn);color:var(--soft);box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center}
.zoom-box .center-btn:hover{color:var(--ink)}
.zoom-box .center-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.zoom-pill{border:0;border-radius:999px;background:var(--rbtn);color:var(--soft);font-size:13px;font-weight:600;
  padding:5px 11px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.zoom-pill:hover{color:var(--ink)}

.group-box{position:absolute;border:2px dashed var(--brand);border-radius:12px;pointer-events:none;z-index:8999}
.clip.selected.in-group:not(.lifted){outline:none!important}
.clip.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,55%{box-shadow:0 0 0 6px var(--brand)}100%{box-shadow:0 0 0 0 transparent}}
/* home: every board at a glance + search across all of them */
.home-btn.on{background:var(--brand);color:#fff}
.home{position:absolute;inset:0;z-index:46;background:var(--paper);overflow:auto;padding:26px 30px 60px;animation:fade .18s}
.home[hidden]{display:none}
.home-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.home-h h2{margin:0 auto 0 0;font-size:30px;font-weight:600}
.home-q{font:inherit;font-size:16px;border:2px solid var(--input-line);border-radius:12px;padding:7px 14px;width:min(380px,100%);outline:0;background:var(--panel);user-select:text;-webkit-user-select:text}
.home-q:focus{border-color:var(--brand)}
.hbtn{border:0;background:var(--chip);border-radius:10px;padding:7px 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.hbtn:hover{background:var(--hover)}
.hbtn .spark{width:12px;height:12px;fill:var(--brand)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.bcard{border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .18s var(--spring),border-color .15s}
.bcard:hover{transform:translateY(-3px);border-color:var(--brand)}
.bcard.cur{border-color:var(--brand)}
.bprev{height:124px;border-radius:12px;background:var(--chip);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:4px;overflow:hidden}
.bprev .tw,.bprev .thumb{width:100%;height:100%;min-height:0}
.bprev .thumb{border-radius:8px;font-size:13px}
.bprev .bempty{grid-column:1/3;grid-row:1/3;display:grid;place-items:center;color:var(--faint);font-size:14px}
.bname{font-size:18px;font-weight:600;display:flex;gap:6px;align-items:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname svg{width:13px;height:13px;fill:var(--brand);flex:none}
.bmeta{font-size:13px;color:var(--faint);padding:0 4px 2px}
.hres{margin-bottom:18px}
.hres h4{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.hrow{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:6px 10px;border-radius:12px;cursor:pointer}
.hrow:hover{background:var(--hover)}
.hrow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .nm small,.hrow > small{display:block;font-size:13px;color:var(--faint);font-weight:400}
.hrow .ren{border:0;background:var(--chip);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--soft)}
/* snapshots in the R panel */
.snap-row{display:flex;align-items:center;gap:6px;padding:4px 0}
.snap-row span{flex:1;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snap-row span small{display:block;font-size:12px;color:var(--faint);font-weight:400}
.snap-row button{border:2px solid var(--input-line);background:var(--panel);border-radius:9px;padding:2px 10px;font-size:13px;font-weight:600;color:var(--soft)}
.organize .ghost{width:100%;border:2px dashed var(--input-line);background:none;border-radius:12px;padding:6px;font-size:15px;font-weight:600;color:var(--soft);margin:4px 0 12px}
/* focus mode: a note as a calm, full-size document */
.focus{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;animation:fade .2s}
.focus-doc{width:min(780px,94vw);margin:34px 0;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.focus-doc .note-bar{position:static;justify-content:center;border:0;border-bottom:1px solid rgba(0,0,0,.08);border-radius:0;box-shadow:none;background:transparent;padding:8px;animation:none}
.focus-doc .note-bar button{color:inherit;opacity:.55}
.focus-doc .note-bar button:hover,.focus-doc .note-bar button.on{opacity:1;background:rgba(0,0,0,.07);color:inherit}
.fdoc{flex:1;overflow:auto;outline:0;padding:40px 64px 80px;font-size:20px;line-height:1.55;white-space:pre-wrap;word-break:break-word;cursor:text;user-select:text;-webkit-user-select:text}
.fdoc h2{font-size:1.75em}
.note-bar .nb-sep{width:1px;background:var(--line);margin:4px 3px}
/* PDF export renders the board on its own, without any app chrome */
.exporting .toolbar,.exporting .r-btn,.exporting .zoom-box,.exporting .hist-btn,.exporting .history,.exporting .add-tile,.exporting .empty,.exporting .resize,.exporting .home,.exporting .toast{display:none!important}
.exporting .canvas{background-image:none!important}
.exporting .clip.selected{outline:none!important}
@media print{.toolbar,.r-btn,.zoom-box,.hist-btn,.history,.tools,.organize,.toast,.add-tile{display:none!important}}
.canvas.dropping{box-shadow:inset 0 0 0 4px var(--brand)}
.surface{position:relative;min-width:100%;min-height:100%}
.surface.grid{display:flex;flex-wrap:wrap;gap:18px;padding:24px 24px 110px;align-content:flex-start}
.surface.list{padding:0 16px 110px}
.list-search{position:sticky;top:0;z-index:6;background:var(--paper);padding:14px 0 2px}
.list-search input{width:100%;font:inherit;font-size:16px;border:2px solid var(--input-line);border-radius:12px;padding:7px 14px;outline:0;background:var(--panel);user-select:text;-webkit-user-select:text;transition:border-color .2s}
.list-search input:focus{border-color:var(--brand)}
.surface.list .lh{top:52px}
.hist-btn{position:absolute;left:18px;bottom:16px;width:44px;height:44px;border-radius:14px;border:0;z-index:40;background:var(--rbtn);color:var(--soft);
  box-shadow:0 2px 12px rgba(0,0,0,.14);display:grid;place-items:center;transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .2s}
.hist-btn:hover{transform:translateY(-2px) rotate(-8deg);color:var(--ink)}
.hist-btn.on{background:var(--brand);color:#fff}
.hist-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.web .hist-btn{display:none}
body.mood .hist-btn{opacity:.28;box-shadow:none}
body.mood .hist-btn:hover,body.mood .hist-btn.on{opacity:1}
.history{position:absolute;left:18px;bottom:70px;width:340px;max-height:calc(100% - 96px);overflow:auto;z-index:41;background:var(--panel);border:3px solid var(--panel-line);
  border-radius:22px;padding:12px 12px 10px;box-shadow:0 14px 40px rgba(0,0,0,.22);transform-origin:bottom left;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.history[hidden]{display:none}
.history .hh{display:flex;align-items:baseline;justify-content:space-between;padding:2px 6px 8px}
.history .hh b{font-size:19px;font-weight:600}
.history .hh button{border:0;background:none;color:var(--faint);font-size:13px;font-weight:600}
.history .hh button:hover{color:var(--red)}
.hitem{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:7px 6px;border-radius:12px;animation:rise .4s cubic-bezier(.34,1.4,.64,1) both}
.hitem:hover{background:var(--hover)}
.hitem .hi{width:40px;height:40px;border-radius:10px;background:var(--chip);display:grid;place-items:center;overflow:hidden;font-size:18px;color:var(--soft)}
.hitem .hi img{width:100%;height:100%;object-fit:cover}
.hitem .ht{min-width:0;font-size:14px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.hitem .hm{display:block;font-size:12px;color:var(--faint);font-weight:400;margin-top:2px}
.hitem .ha{font-size:13px;font-weight:700;color:var(--brand);opacity:0;transition:opacity .15s}
.hitem:hover .ha,.hitem.done .ha{opacity:1}
.hitem.done .ha{color:#3f9a49}
.history .hempty{padding:18px 8px;color:var(--faint);font-size:14px;text-align:center}
.home-search{display:flex;align-items:center;width:min(460px,100%);border:2px solid var(--input-line);border-radius:12px;background:var(--panel);transition:border-color .2s}
.home-search:focus-within{border-color:var(--brand)}
.home-search .home-q{border:0;flex:1;min-width:0;width:auto;background:none;padding:7px 12px}
.home-mode{font:inherit;font-size:14px;font-weight:600;border:0;border-left:1px solid var(--line);background:none;color:var(--soft);padding:0 12px;height:32px;cursor:pointer;outline:0}
.home-seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px}
.home-seg button{border:0;background:none;border-radius:8px;padding:5px 14px;font-size:14px;font-weight:600;color:var(--soft)}
.home-seg button.on{color:var(--ink)}
.home-seg > .pill{background:var(--panel);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.bcard{animation:rise .45s cubic-bezier(.34,1.4,.64,1) both}
.bcard.closed{opacity:.6;border-style:dashed}
.bcard.closed:hover{opacity:1}
.bbadge{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--chip);color:var(--faint);border-radius:6px;padding:1px 6px;margin-left:auto}
.hrow{animation:rise .35s cubic-bezier(.34,1.4,.64,1) both}
.surface.fade{animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.marquee{position:absolute;display:none;border:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);border-radius:6px;z-index:9000;pointer-events:none}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:var(--brand);pointer-events:none;padding:24px}
.empty[hidden]{display:none}
.empty h2{font-size:clamp(26px,4vw,46px);font-weight:600;margin:0 0 .7em;line-height:1}
.empty p{font-size:clamp(22px,3.4vw,40px);font-weight:600;margin:0;line-height:1.05}
.empty .hint{margin-top:1.4em;font-size:15px;font-weight:500;color:var(--faint)}

/* ---------- add tile ---------- */
.add-tile{border:3px dashed var(--muted);border-radius:16px;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.add-tile:hover{border-color:var(--faint);background:var(--hover)}
.add-tile svg{width:64px;height:64px;stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.add-tile.v-free{position:absolute;left:24px;top:24px;width:150px;height:210px;z-index:0}
.add-tile.v-grid{width:180px;height:180px}
.add-row{display:flex;align-items:center;gap:14px;width:100%;height:60px;border:0;background:none;padding:0 12px;border-radius:12px;color:var(--faint);font-size:17px;font-weight:500}
.add-row:hover{background:var(--hover)}
.add-row i{width:44px;height:44px;border:2.5px dashed var(--muted);border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:24px}
.add-menu{position:fixed;z-index:70;background:var(--panel);border:3px solid var(--panel-line);border-radius:18px;padding:8px;width:270px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:pop .16s var(--ease)}
.add-menu button.row{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;font-size:16px;font-weight:500}
.add-menu button.row:hover{background:var(--hover)}
.add-menu form{display:flex;gap:6px;padding:4px}
.add-menu input,.add-menu textarea{flex:1;font:inherit;font-size:15px;border:2px solid var(--input-line);border-radius:10px;padding:6px 10px;outline:0;resize:none;user-select:text;-webkit-user-select:text}
.add-menu input:focus,.add-menu textarea:focus{border-color:var(--link)}
.add-menu form button{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:0 12px;font-weight:600}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@keyframes clipIn{from{opacity:0;transform:scale(.55) translateY(14px)}}
@keyframes softIn{from{opacity:0;transform:scale(.94) translateY(8px)}}
@keyframes clipOut{to{opacity:0;transform:scale(.7)}}
@keyframes tabIn{from{opacity:0;transform:scale(.6)}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.96)}}
.clip.enter{animation:clipIn .55s cubic-bezier(.34,1.56,.64,1) both}
.clip.enter-soft{animation:softIn .42s cubic-bezier(.34,1.3,.64,1) both}
.clip.leave{animation:clipOut .19s ease-in forwards;pointer-events:none}
.clip.dim{transition:opacity .3s}
.clip.glide-t{transition:transform .62s cubic-bezier(.34,1.35,.64,1),opacity .3s}
.clip.floated{z-index:5000!important}
/* a sliding highlight behind the selected option of any segmented control (data-pill) */
[data-pill]{position:relative}
[data-pill] > .pill{position:absolute;left:0;top:0;pointer-events:none;z-index:0;opacity:0;
  transition:transform .55s cubic-bezier(.34,1.56,.64,1),width .55s cubic-bezier(.34,1.56,.64,1),height .3s,opacity .2s}
[data-pill] > button{position:relative;z-index:1;transition:color .25s}
.ctx,.picker,.add-menu,.note-bar{animation-duration:.24s!important;animation-timing-function:cubic-bezier(.34,1.56,.64,1)!important}
.empty:not([hidden]){animation:fade .45s var(--ease)}
#editBtn:not([hidden]){animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.tools:not([hidden]){animation:rise .38s cubic-bezier(.34,1.56,.64,1)}
.group-box{animation:fade .2s}

/* ---------- clips ---------- */
.clip{border-radius:16px;cursor:grab;touch-action:none}
.clip.v-free{position:absolute}
.clip.v-grid{position:relative;width:180px;height:180px;flex:none}
.clip.selected:not(.lifted){outline:3px solid var(--ink);outline-offset:3px}
.clip.dim{opacity:.15;pointer-events:none}
.clip.hidden{display:none}
.clip.out{opacity:.18;transform:scale(.92);transition:opacity .2s,transform .2s}
.clip.lifted{box-shadow:0 28px 50px rgba(40,15,5,.26),0 6px 14px rgba(0,0,0,.12);transition:box-shadow .2s;z-index:9999!important;will-change:transform;backface-visibility:hidden}
.clip.land{transition:transform .34s cubic-bezier(.25,1.3,.5,1),box-shadow .3s}
.clip.settle{transition:transform .5s var(--spring),box-shadow .3s}
.clip.glide{transition:left .4s cubic-bezier(.22,1,.36,1),top .4s cubic-bezier(.22,1,.36,1),transform .55s var(--spring),box-shadow .35s}
.label{position:absolute;right:10px;bottom:6px;color:#fff;font-weight:700;font-size:20px;text-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none}
.pin{position:absolute;right:-7px;top:-7px;width:26px;height:26px;border-radius:50%;background:var(--brand);display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:4;pointer-events:none}
.pin svg{width:14px;height:14px;fill:#fff}
.t-image,.t-video,.t-file,.t-text{overflow:visible}
.t-image .media,.t-video .media{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#ddd}
.t-image img,.t-video video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.play{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);pointer-events:none;transition:opacity .2s}
.play::after{content:"";border-left:22px solid rgba(255,255,255,.9);border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
.playing .play{opacity:0}

.t-file{background:var(--doc);color:var(--squig)}
.t-file .inner{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.t-file .fold{position:absolute;right:0;top:0;width:34%;height:24%;background:rgba(0,0,0,.12);border-bottom-left-radius:16px}
.t-file svg.squig{position:absolute;left:10%;top:9%;width:72%;height:62%;pointer-events:none}
.t-file .label{color:inherit;text-shadow:none}
.t-file .fname{position:absolute;left:12px;right:12px;bottom:34px;font-size:12px;font-weight:500;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.t-link{background:var(--link);color:#fff}
.t-link.v-free{height:46px;border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 14px 0 16px;font-size:21px;font-weight:500}
.t-link .lt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-link .pc{flex:none;width:22px;height:26px}
.t-link.v-grid{padding:16px;display:flex;flex-direction:column;gap:4px}
.t-link .ldom{font-size:23px;font-weight:600;line-height:1.05;word-break:break-word}
.t-link .lpath{font-size:14px;opacity:.85;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.t-link.v-grid .pc{position:absolute;right:14px;bottom:12px;width:26px;height:30px}

.t-text{background:#fff;color:#1E1E1E;box-shadow:0 0 0 2px var(--line) inset}
.t-text .ntext{padding:14px 16px;font-size:18px;line-height:1.3;white-space:pre-wrap;word-break:break-word;height:100%;overflow:hidden;outline:0;border-radius:inherit}
.t-text .ntext[contenteditable="true"]{cursor:text;user-select:text;-webkit-user-select:text;box-shadow:0 0 0 3px var(--link) inset;overflow:auto}
.ntext h1,.ntext h2,.ntext h3{margin:0 0 .12em;font-size:1.4em;line-height:1.1;font-weight:700}
.ntext ul{margin:.1em 0;padding-left:1.15em}
.ntext li{margin:.05em 0}
.ntext b{font-weight:700}
.note-bar{position:fixed;z-index:85;display:flex;gap:2px;background:var(--panel);border:2px solid var(--panel-line);border-radius:11px;padding:3px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:pop .12s}
.note-bar button{border:0;background:none;min-width:30px;height:28px;border-radius:7px;font-size:15px;color:var(--soft);padding:0 6px}
.note-bar button:hover{background:var(--hover);color:var(--ink)}
.note-bar button.on{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--brand)}

.comment{position:absolute;left:8px;top:8px;max-width:calc(100% - 16px);background:#fff;color:#111;border-radius:999px;padding:2px 10px 2px 4px;
  font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.15);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;pointer-events:none;z-index:2}
.t-link.v-free .comment{top:-30px;left:0}
.comment i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center}
.resize{position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;opacity:0;z-index:3}
.clip.selected .resize{opacity:1}
.resize::after{content:"";position:absolute;right:6px;bottom:6px;width:10px;height:10px;border-right:3px solid #fff;border-bottom:3px solid #fff;
  border-bottom-right-radius:3px;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.8))}
.ph{border:3px dashed var(--muted);border-radius:16px;flex:none;background:var(--hover)}
.ph.v-list{border-radius:12px;width:100%!important}

/* list view */
.lh{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:44px 1fr 110px 150px 80px;gap:14px;padding:14px 12px 8px;background:var(--paper);
  border-bottom:1px solid var(--line);margin-bottom:6px}
.lh button{border:0;background:none;text-align:left;padding:0;font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--faint)}
.lh button.on{color:var(--brand)}
.clip.v-list{display:grid;grid-template-columns:44px 1fr 110px 150px 80px;gap:14px;align-items:center;height:60px;padding:0 12px;border-radius:12px;
  font-size:16px;position:relative}
.clip.v-list:hover{background:var(--hover)}
.clip.v-list.selected:not(.lifted){outline:0;background:color-mix(in srgb,var(--brand) 16%,transparent)}
.clip.v-list.lifted{background:var(--panel)}
.clip.v-list .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip.v-list .nm .pin-i{width:13px;height:13px;fill:var(--brand);margin-right:5px;vertical-align:-1px}
.clip.v-list .nm small{display:block;font-size:13px;color:var(--faint);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip.v-list .kd,.clip.v-list .dt,.clip.v-list .sz{color:var(--soft);font-size:15px;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;position:relative;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.thumb.t-text{font-size:15px}
.thumb svg{width:18px;height:22px}

/* ---------- R button + organize panel ---------- */
.r-btn{position:absolute;right:18px;bottom:16px;width:54px;height:54px;border-radius:15px;border:0;z-index:40;display:grid;place-items:center;
  background:var(--rbtn);box-shadow:0 2px 12px rgba(0,0,0,.18);transition:transform .25s var(--spring),background .2s}
.r-btn:hover{transform:translateY(-2px) rotate(-4deg)}
.r-btn:active{transform:scale(.94)}
.r-btn svg{width:34px;height:34px;fill:var(--paper);stroke:var(--ink);stroke-width:6.5}
.r-btn.on{background:var(--brand)}
.r-btn.on svg{fill:var(--brand);stroke:#fff}
.organize{position:absolute;right:18px;bottom:82px;width:316px;max-height:calc(100% - 100px);overflow:auto;background:var(--panel);border:3px solid var(--panel-line);
  border-radius:22px;padding:14px 16px 16px;z-index:41;box-shadow:0 14px 40px rgba(0,0,0,.22);transform-origin:bottom right;animation:pop .18s var(--ease)}
.organize[hidden]{display:none}
.org-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.org-h b{font-size:21px;font-weight:600}
.org-h span{font-size:13px;color:var(--faint)}
.org-q{width:100%;font:inherit;font-size:15px;border:2px solid var(--input-line);border-radius:10px;padding:6px 10px;outline:0;margin-bottom:12px;user-select:text;-webkit-user-select:text}
.org-q:focus{border-color:var(--brand)}
.org-l{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:4px 0 6px}
.org-l .dir{border:0;background:var(--chip);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;color:var(--soft);text-transform:none;letter-spacing:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:500;color:var(--soft)}
.seg button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.seg button.on{color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border:2px solid var(--input-line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:500;color:var(--soft)}
.chips button.on{border-color:var(--brand);color:var(--brand)}
.organize .wide{width:100%;border:0;background:var(--brand);color:#fff;border-radius:12px;padding:8px;font-size:16px;font-weight:600}
.seg.seg-t button{padding:6px 0;font-size:14px}
.org-tog{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:500;margin:-2px 0 12px}
.org-zoom{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.org-zoom b{flex:1;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.org-zoom button,.org-plug button{border:2px solid var(--input-line);background:var(--panel);border-radius:9px;padding:2px 10px;font-size:14px;font-weight:600;color:var(--soft)}
.org-plug{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ai-code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--chip);border-radius:10px;padding:10px 12px;white-space:pre;overflow:auto;user-select:text;-webkit-user-select:text;margin:6px 0}
.plug-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.plug-row b{display:block;font-size:15px;font-weight:600}
.plug-row small{display:block;font-size:13px;color:var(--faint)}
.plug-row small.err{color:var(--red)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.kbd-rec{min-width:86px}
.kbd-rec.rec{background:var(--brand)!important;color:#fff}

/* ---------- menus, picker, dialogs ---------- */
.ctx{transform-origin:top left;position:fixed;z-index:80;background:var(--panel);border-radius:14px;padding:6px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.25);border:2px solid var(--panel-line);animation:pop .12s}
.ctx .head{padding:4px 12px 6px;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.ctx button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 12px;border-radius:9px;font-size:15px;font-weight:500;text-align:left}
.ctx button:hover:not(:disabled){background:var(--hover)}
.ctx button:disabled{opacity:.5;cursor:default}
.ctx button.danger{color:var(--red)}
.ctx button svg{width:14px;height:14px;fill:var(--brand);flex:none}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.picker{position:fixed;z-index:81;background:var(--panel);border:3px solid var(--panel-line);border-radius:22px;padding:8px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:pop .14s}
.picker h4{margin:0 0 8px;text-align:center;font-size:19px;font-weight:600}
.picker .grid{display:grid;grid-template-columns:repeat(6,36px);gap:10px}
.picker .sw{width:36px;height:36px;border-radius:50%;border:0;padding:0;transition:transform .15s}
.picker .sw.on{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--faint)}
.picker .sw:hover{transform:scale(1.1)}
.modal{position:fixed;inset:0;z-index:90;background:rgba(20,14,10,.35);display:grid;place-items:center;animation:fade .2s}
.modal .dlg{animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
.dlg{background:var(--panel);border-radius:18px;padding:18px;width:min(360px,calc(100% - 32px));box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 12px;font-size:20px;font-weight:600}
.dlg input:not([type=checkbox]):not([type=color]){width:100%;font:inherit;font-size:16px;border:2px solid var(--input-line);border-radius:10px;padding:8px 10px;outline:0;user-select:text;-webkit-user-select:text}
.dlg input:focus{border-color:var(--brand)}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dlg .btns button{border:0;border-radius:10px;padding:6px 16px;font-size:15px;font-weight:600;background:var(--chip)}
.dlg .btns .primary{background:var(--brand);color:#fff}
.dlg .btns .danger{background:var(--red);color:#fff}

/* settings */
.dlg.settings{width:min(470px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;padding:20px 22px 22px}
.set-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.set-h h3{margin:0;font-size:24px}
.set-h .close{border:0;background:var(--chip);width:30px;height:30px;border-radius:50%;font-size:13px}
.settings section{padding:14px 0;border-bottom:1px solid var(--line)}
.settings section:last-child{border-bottom:0;padding-bottom:0}
.settings h4{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.settings .note{margin:0 0 10px;font-size:14px;color:var(--soft);line-height:1.35}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 0;cursor:pointer}
.set-row b{display:block;font-size:16px;font-weight:500}
.set-row small{display:block;font-size:13px;color:var(--faint);line-height:1.3}
.set-row.off{opacity:.45;pointer-events:none}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:42px;height:25px;border-radius:999px;background:var(--muted);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--spring)}
.switch:checked{background:var(--brand)}
.switch:checked::after{transform:translateX(17px)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.seg3 button{border:0;background:none;border-radius:9px;padding:7px 0;font-size:15px;font-weight:500;color:var(--soft)}
.seg3 button.on{color:var(--brand)}
.seg3 > .pill,.seg > .pill{background:var(--panel);border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.kbd{display:inline-block;font-weight:600;background:var(--chip);border-radius:6px;padding:0 6px;font-size:14px}
.perm{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px;padding:8px 12px;border-radius:12px;background:var(--chip);font-size:14px;color:var(--soft)}
.perm.ok{color:#3f9a49}
.perm button{border:0;background:var(--brand);color:#fff;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:600;flex:none}
.sel-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 0;font-size:16px;font-weight:500}
.sel-row select{font:inherit;font-size:15px;border:2px solid var(--input-line);border-radius:10px;padding:4px 8px;background:var(--panel);max-width:60%}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--toast-fg);padding:8px 18px;
  border-radius:999px;font-size:15px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:99;display:flex;align-items:center;gap:14px;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.show.act{pointer-events:auto}
.toast button{border:0;background:none;color:var(--brand);font-weight:700;padding:0;font-size:15px}

/* top-bar mode toggle */
.mode-seg{display:flex;flex:none;background:var(--hover);border-radius:9px;padding:3px;gap:2px}
.mode-seg button{border:0;background:none;border-radius:7px;padding:3px 12px;font-size:14px;font-weight:500;color:var(--soft);display:flex;align-items:center;gap:5px}
.mode-seg button.on{color:var(--ink)}
.mode-seg > .pill{background:var(--panel);border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.14)}
#editBtn[hidden]{display:none}
#editBtn.on{background:var(--brand);color:#fff}

/* mood edit tools */
.tools{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:42;display:flex;align-items:center;gap:3px;background:var(--panel);
  border:2px solid var(--panel-line);border-radius:14px;padding:5px 8px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:pop .16s var(--ease);max-width:calc(100% - 24px);overflow-x:auto}
.tools[hidden]{display:none}
.tools button{flex:none;border:0;background:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--soft)}
.tools button:hover{background:var(--hover);color:var(--ink)}
.tools button.on{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--brand)}
.tools button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tools .sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 4px}
.tools button.ink{width:22px;height:22px;border-radius:50%;margin:0 2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tools button.ink.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--brand)}
.tools button i{display:block;border-radius:50%;background:currentColor}
.tools select{flex:none;font:inherit;font-size:14px;border:2px solid var(--input-line);border-radius:9px;padding:3px 6px;background:var(--panel);margin-left:2px}
.canvas.drawing,.canvas.drawing *{cursor:crosshair!important}
.canvas.drawing[data-tool=text],.canvas.drawing[data-tool=text] *{cursor:text!important}
.draw-preview{position:absolute;left:0;top:0;pointer-events:none;z-index:9500;overflow:visible;color:var(--ink)}

/* drawings, arrows and titles */
.t-ink,.t-arrow{color:var(--ink);pointer-events:none;border-radius:6px}
.t-ink svg.vec,.t-arrow svg.vec{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.t-ink .hit,.t-arrow .hit{pointer-events:stroke;cursor:grab}
.t-ink .resize,.t-arrow .resize{pointer-events:auto}
.t-ink.v-grid,.t-arrow.v-grid{pointer-events:auto;background:var(--chip)}
.t-ink.v-grid svg.vec,.t-arrow.v-grid svg.vec{inset:18px;width:calc(100% - 36px);height:calc(100% - 36px)}
.t-text.title{background:transparent!important;box-shadow:none;color:var(--ink)}
.t-text.title .ntext{padding:0 3px;line-height:.92;font-weight:600;font-synthesis:none;white-space:pre;overflow:visible;height:auto}
.t-text.title.v-grid{background:var(--chip)!important}
.t-text.title.v-grid .ntext{font-size:26px!important;white-space:pre-wrap;padding:14px}

/* viewer (browser version; the Mac app uses Quick Look) */
.viewer{position:fixed;inset:0;z-index:95;background:rgba(10,8,6,.86);display:grid;place-items:center;animation:fade .15s}
.viewer img,.viewer video{max-width:92vw;max-height:86vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.viewer iframe{width:86vw;height:86vh;border:0;border-radius:10px;background:#fff}
.viewer .vclose{position:absolute;top:16px;right:18px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:15px}
.viewer .vname{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:15px}
.settings .btn{border:0;background:var(--chip);border-radius:9px;padding:5px 14px;font-size:15px;font-weight:600;flex:none}
.settings .btn:hover{background:var(--hover)}
.sel-row.off{opacity:.45;pointer-events:none}
.sel-row small{display:block;font-size:13px;color:var(--faint);font-weight:400}

/* file previews (Quick Look thumbnails / app document icons) */
.t-file .qlthumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;pointer-events:none}
.t-file .appicon{display:none;position:absolute;left:50%;top:44%;width:92px;height:92px;transform:translate(-50%,-50%);pointer-events:none}
.t-file.has-thumb .qlthumb,.t-file.has-icon .appicon{display:block}
.t-file.has-thumb .fold,.t-file.has-thumb .squig,.t-file.has-thumb .fname,.t-file.has-icon .fold,.t-file.has-icon .squig{display:none}
.t-file.has-thumb .label{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.thumb .qlthumb,.thumb .appicon{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.has-thumb .qlthumb{display:block}
.thumb.has-icon{background:transparent!important}
.thumb.has-icon .appicon{display:block;object-fit:contain}
.thumb.has-thumb span,.thumb.has-icon span{display:none}
.clip.missing .media::after{content:"Original file missing";position:absolute;inset:0;display:grid;place-items:center;background:var(--chip);color:var(--faint);font-size:14px;font-weight:600}

/* mood board: a clean, aesthetic canvas */
body.mood .add-tile,body.mood .add-row,body.mood .pin,body.mood .label,body.mood .fname,body.mood .comment,body.mood .t-file .fold{display:none}
body.mood .t-text.plain{background:transparent!important;box-shadow:none;color:var(--ink)!important}
body.mood .t-text .ntext{font-size:28px;font-weight:600;line-height:1.1;padding:6px 4px}
body.mood .clip{border-radius:10px}
body.mood .t-link.v-free{border-radius:999px}
body.mood .clip.selected:not(.lifted){outline:2px solid var(--brand);outline-offset:4px}
body.mood .r-btn{opacity:.28;box-shadow:none;transition:opacity .2s,transform .25s var(--spring)}
body.mood .r-btn:hover,body.mood .r-btn.on{opacity:1}
.board-tab .spark{width:12px;height:12px;fill:currentColor;opacity:.85}

/* custom colours */
.seg4{grid-template-columns:repeat(4,1fr)}
.custom-theme{margin-top:10px}
.custom-theme[hidden]{display:none}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0;cursor:pointer}
.color-row b{display:block;font-size:16px;font-weight:500}
.color-row small{display:block;font-size:13px;color:var(--faint)}
input[type=color]{-webkit-appearance:none;appearance:none;width:44px;height:30px;border:2px solid var(--input-line);border-radius:9px;padding:2px;cursor:pointer;background:var(--panel)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}
.presets{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.presets button{width:34px;height:34px;border-radius:50%;border:2px solid var(--input-line);padding:0;position:relative}
.presets button i{position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:50%}
.picker .custom-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);max-width:276px}
.picker .custom-row > span{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);width:100%}
.picker .sw.add{position:relative;display:grid;place-items:center;background:conic-gradient(from 90deg,#E2513A,#F2E14F,#64B96A,#6BBFE0,#8B5CF0,#E87BC2,#E2513A);color:#fff;font-weight:700;font-size:20px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.picker .sw.add input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}

@media (max-width:700px){
  .tb-btn .t{display:none}
  .lh,.clip.v-list{grid-template-columns:44px 1fr 90px}
  .lh .c-dt,.lh .c-sz,.clip.v-list .dt,.clip.v-list .sz{display:none}
}
</style>
</head>

<script>
(() => {
'use strict';

/* ================= platform ================= */
const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.recol);
document.documentElement.classList.add(NATIVE ? 'native' : 'web');
// ?export=<board id>: this page is the invisible copy the Mac app prints to PDF. It never saves anything.
const EXPORT = new URLSearchParams(location.search).get('export');
const call = (op, a = {}) => NATIVE ? window.webkit.messageHandlers.recol.postMessage({ op, ...a }) : Promise.resolve(null);
if (NATIVE) document.getElementById('emptyHint').innerHTML = 'Drop anything here, paste with ⌘V, or press <b>⌃⌘C</b> in any app';

/* ================= constants & utils ================= */
const PALETTE = [
  '#C9363A','#64B96A','#6BBFE0','#52758C','#4A8571','#E87BC2',
  '#D89E3A','#5A3510','#F2E14F','#F7DB6E','#DB8F94','#8B5CF0',

const DEFAULT_SETTINGS = { theme: 'system', customMain: '#F5F3EF', customAccent: '#E2513A', customColors: [], allSticky: false,
  hotkey: true, copyFirst: true, copyHistory: true, quickMode: 'services', shortcut: '^@c', disabledPlugins: [], menuBar: true, openAtLogin: false, quickTarget: 'current', linkLarge: 10,
  font: 'Saira', titleFont: 'DM Serif', inkColor: 'ink', inkWidth: 4 };
const THEME_PRESETS = [['#F5F3EF','#E2513A'],['#1B1918','#E2513A'],['#EEF3F7','#3B6FD8'],['#13201B','#7BD389'],['#FBEFF3','#D9467A'],['#1E1B2E','#A78BFA'],['#F7F1E3','#2F6B4F'],['#0F0F10','#F2E14F']];
const SPARK = '<svg class="spark" viewBox="0 0 24 24"><use href="#spark"/></svg>';
const FONTS = {
  'Saira': "'Saira Semi Condensed','Avenir Next Condensed',system-ui,sans-serif", 'Inter': "'Inter',system-ui,sans-serif",
  'Space Grotesk': "'Space Grotesk',system-ui,sans-serif", 'System': "-apple-system,BlinkMacSystemFont,system-ui,sans-serif",
  'DM Serif': "'DM Serif Display',Georgia,serif", 'Playfair': "'Playfair Display',Georgia,serif", 'Fraunces': "'Fraunces',Georgia,serif",

const TOOL_ICON = {

  arrow: '<svg viewBox="0 0 24 24"><path d="M4 20L20 4M11 4h9v9"/></svg>',
  text: '<svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>',

  rect: '<svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1.5"/></svg>',
  ellipse: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>',
  tri: '<svg viewBox="0 0 24 24"><path d="M12 4.5 20 19H4z"/></svg>'
};
const VEC = ['ink', 'arrow', 'line', 'shape'];          // drawn things, all SVG paths
const SHAPES = ['rect', 'ellipse', 'tri'];
const SHAPE_NAME = { rect: 'Square', ellipse: 'Circle', tri: 'Triangle' };
const viewable = c => ['image', 'video', 'file'].includes(c.type);
const PAD = 16, START = 24, ADD_W = 150, ADD_H = 210;
const PIN = '<svg class="pin-i" viewBox="0 0 24 24"><use href="#pin"/></svg>';
const LOCK_I = '<svg class="lk" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const $ = s => document.querySelector(s);
const canvas = $('#canvas'), surface = $('#surface');
const uid = () => (Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4)).replace(/[^a-z0-9]/g, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const extOf = n => { const m = /\.([a-z0-9]{1,6})$/i.exec(n || ''); return m ? m[1].toLowerCase() : ''; };
const isURL = s => /^(https?:\/\/|www\.)\S+$/i.test(s.trim());
const prettyURL = u => u.replace(/^https?:\/\//i, '').replace(/\/$/, '');
const IMG_EXT = /\.(png|jpe?g|gif|webp|svg|avif)(\?|#|$)/i;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const safeName = n => String(n || 'clip').replace(/[\/:\\\u0000-\u001f]+/g, '-').replace(/^\.+/, '').slice(0, 120) || 'clip';
const toB64 = b => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1] || ''); f.onerror = rej; f.readAsDataURL(b); });
function textColor(hex) {
  const n = parseInt((hex || '#ffffff').slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? '#1E1E1E' : '#FFFFFF';
}
function hue(hex) {
  if (!hex) return 999;
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (d < .08) return 400 + mx * 100;
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 360) % 360;
}
const fmtSize = b => !b ? '—' : b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
function fmtDate(t) {
  if (!t) return '—';
  const d = new Date(t), now = new Date();
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'Today, ' + time;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday, ' + time;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}

/* ================= storage ================= */
const NativeStore = {
  async load() { try { const s = await call('load'); return s ? JSON.parse(s) : null; } catch { return null; } },
  save(st) { call('save', { data: JSON.stringify(st) }); },
  async putFile(key, file, fileName) {
    const ok = await call('putFile', { key, name: fileName, data: await toB64(file) });
    if (!ok) throw new Error('Could not save file');
  },
  srcSync(c) { return c.blobKey ? `files/${c.blobKey}/${encodeURIComponent(c.fileName)}` : c.url; },
  async src(c) { return this.srcSync(c); },
  async blob(c) { return (await fetch(this.srcSync(c))).blob(); },
  del(key) { call('deleteFile', { key }); }
};
const WebStore = (() => {
  let db = null; const mem = { state: null, blobs: new Map() }; const urls = new Map();
  const open = () => new Promise(res => {
    try {
      const r = indexedDB.open('recol', 2);
      r.onupgradeneeded = () => { const d = r.result; for (const n of ['boards', 'blobs', 'meta']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); };
      r.onsuccess = () => { db = r.result; res(); }; r.onerror = () => res();
    } catch { res(); }
  });
  const req = (store, mode, fn) => new Promise(res => {
    try { const t = db.transaction(store, mode), q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => res(undefined); }
    catch { res(undefined); }
  });
  return {
    async load() {
      await open(); if (!db) return mem.state;
      let st = await req('meta', 'readonly', s => s.get('state'));
      if (!st) {
        const old = await req('boards', 'readonly', s => s.getAll());
        if (old && old.length) st = { boards: old.sort((a, b) => a.created - b.created), current: await req('meta', 'readonly', s => s.get('current')) };
      }

/* ================= copy / download ================= */
async function copyClips(clips) {
  if (!clips.length) return;
  clips = clips.filter(payloadFor); if (!clips.length) return;
  if (NATIVE) { await call('copy', { payloads: clips.map(payloadFor) }); return toast(clips.length > 1 ? `Copied ${plural(clips.length, 'clip')}` : 'Copied'); }
  const c = clips[0];
  try {
    if (c.type === 'text') await navigator.clipboard.writeText(c.text);
    else if (!c.blobKey) await navigator.clipboard.writeText(c.url);
    else {
      let b = await Store.blob(c);
      if (c.type === 'image' && b.type !== 'image/png') b = await toPNG(b);
      await navigator.clipboard.write([new ClipboardItem({ [b.type]: b })]);
    }
    toast('Copied');
  } catch { toast('This browser can’t copy that type — try Download'); }
}
function toPNG(blob) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => { const cv = document.createElement('canvas'); cv.width = i.naturalWidth; cv.height = i.naturalHeight; cv.getContext('2d').drawImage(i, 0, 0); cv.toBlob(res, 'image/png'); };
    i.onerror = rej; i.src = URL.createObjectURL(blob);
  });
}
async function downloadClip(c) {
  if (NATIVE) return call('saveFile', { payload: payloadFor(c) });
  const a = document.createElement('a'); a.href = await Store.src(c); a.download = c.name; a.click();
}

/* ================= keyboard & paste ================= */
const typing = t => t.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(t.tagName);
document.addEventListener('keydown', e => {
  if (typing(e.target) || document.querySelector('.modal')) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (e.key === 'Escape') { if (designMode && tool !== 'select') { setTool('select'); return; } if (histOpen) { toggleHistory(false); return; } if (filtering() && board.view === 'free') { clearSearch(); return; } closeMenus(); select(null); if (orgOpen) { orgOpen = false; renderOrganize(); } }
  const TOOL_KEYS = { v: 'select', p: 'pen', l: 'line', a: 'arrow', r: 'rect', o: 'ellipse', t: 'text' };
  if (!mod && designMode && TOOL_KEYS[k]) { setTool(TOOL_KEYS[k]); return; }
  if (!mod && k === 'e' && board.mood) { setDesign(!designMode); return; }
  if (e.key === ' ') { e.preventDefault(); return; }   // hold Space to pan (see camera); a quick tap opens Quick Look
  if (mod && k === 'a') { e.preventDefault(); setSel(shown().filter(matches).map(c => c.id)); return; }
  if (!NATIVE && mod && k === 'k') { e.preventDefault(); toggleOrganize(); }
  if (!NATIVE && mod && e.key === ',') { e.preventDefault(); openSettings(); }
  if (!NATIVE && e.ctrlKey && e.metaKey && k === 'n') { e.preventDefault(); newNote(); return; }
  if (!NATIVE && mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomBy(1.25); return; }
  if (!NATIVE && mod && e.key === '-') { e.preventDefault(); zoomBy(0.8); return; }
  if (!NATIVE && mod && e.key === '0') { e.preventDefault(); zoomTo(1); return; }
  if (!NATIVE && mod && k === 'g') { e.preventDefault(); e.shiftKey ? ungroupSelection() : groupSelection(); return; }
  if (!NATIVE && mod && e.shiftKey && k === 'h') { e.preventDefault(); toggleHome(); return; }
  if (!sel.size) return;
  const cs = selClips();
  if ((e.key === 'Delete' || e.key === 'Backspace') && board.locked) { e.preventDefault(); lockedNote(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeClips(cs.map(c => c.id)); }
  else if (mod && k === 'c' && !String(getSelection())) { e.preventDefault(); copyClips(cs); }
  else if (mod && k === 'j' && !NATIVE) { e.preventDefault(); toggleStickySelection(); }
  else if (e.key === 'Enter' && cs.length === 1) openClip(cs[0]);
  else if (e.key.startsWith('Arrow') && board.view === 'free' && !board.locked) {
    e.preventDefault(); const d = board.snap ? GRID : e.shiftKey ? 20 : 4;
    for (const c of cs) {
      if (e.key === 'ArrowLeft') c.x -= d;
      if (e.key === 'ArrowRight') c.x += d;
      if (e.key === 'ArrowUp') c.y -= d;
      if (e.key === 'ArrowDown') c.y += d;
    }
    save(); render();
  }
});

function recordShortcut(btn, done) {

  const key = e => {
    e.preventDefault(); e.stopPropagation();

async function share() {

  const text = JSON.stringify({ recol: 2, name: board.name, view: board.view, sort: board.sort, dir: board.dir, sticky: board.sticky, mood: board.mood, grid: board.grid, clips: board.clips, shapes: board.shapes || [], files });

async function importFile(f) {

    if (!pkg.recol || !Array.isArray(clips)) throw 0;
    const keyMap = {};
    for (const [k, data] of Object.entries(pkg.files || {})) {
      const blob = await (await fetch(data)).blob();
      const src = clips.find(c => c.blobKey === k) || {};
      const nk = uid(), fileName = safeName(src.fileName || src.name);
      await Store.putFile(nk, blob, fileName);

    const b = newBoardObj(pkg.name || 'Shared clipboard');
    Object.assign(b, { view: pkg.view || 'free', sort: pkg.sort || 'added', dir: pkg.dir || 1, sticky: pkg.sticky, mood: pkg.mood, grid: pkg.grid });
    const all = [...clips, ...(pkg.shapes || [])].map((c, i) => ({ ...c, id: uid(), added: c.added || Date.now() + i, order: c.order ?? i,
      ...(c.blobKey ? { blobKey: keyMap[c.blobKey]?.key, fileName: keyMap[c.blobKey]?.fileName } : {}) }));
    b.clips = all.filter(c => !isShape(c)); b.shapes = all.filter(isShape);

}

/* ================= dialogs & toast ================= */
function ask({ title, value = '', placeholder = '', ok = 'OK', danger = false, input = true }) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<form class="dlg"><h3>${esc(title)}</h3>${input ? `<input name="v" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off">` : ''}
      <div class="btns"><button type="button" data-x>Cancel</button><button class="${danger ? 'danger' : 'primary'}">${esc(ok)}</button></div></form>`;
    document.body.appendChild(m);
    const f = m.querySelector('form'), done = v => { m.remove(); res(v); };
    f.onsubmit = e => { e.preventDefault(); done(input ? f.v.value : true); };
    m.querySelector('[data-x]').onclick = () => done(null);
    m.addEventListener('pointerdown', e => { if (e.target === m) done(null); });
    m.addEventListener('keydown', e => { if (e.key === 'Escape') done(null); });
    if (input) { f.v.focus(); f.v.select(); } else f.querySelector('.danger,.primary').focus();
  });
}
let toastT = 0;
function toast(msg, action, fn) {
  const t = $('#toast'), btn = t.querySelector('button');
  t.querySelector('span').textContent = msg;
  btn.hidden = !action; btn.textContent = action || '';
  btn.onclick = () => { t.classList.remove('show'); fn && fn(); };
  t.classList.toggle('act', !!action);
  t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), action ? 6000 : 2400);
}

canvas.addEventListener('pointerdown', e => {
  if (!designMode || tool === 'select' || e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const P = ev => { const w = toWorld(ev.clientX, ev.clientY); return [w.x, w.y]; };
  const s = state.settings, color = s.inkColor === 'ink' ? undefined : s.inkColor, sw = s.inkWidth;
  if (tool === 'text') {
    const [x, y] = P(e);
    const c = addClip({ type: 'text', title: true, text: '', font: s.titleFont, fs: 44, color }, { w: 60, h: 56 }, { x: x + 24, y });
    setTool('select');
    const n = elFor(c.id); if (n) editNote(n, c);
    return;
  }
  const svg = document.createElementNS(SVGNS, 'svg'); svg.classList.add('draw-preview');
  svg.setAttribute('width', 1); svg.setAttribute('height', 1);
  const path = document.createElementNS(SVGNS, 'path');
  Object.entries({ fill: 'none', stroke: color || 'currentColor', 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }).forEach(([k, v]) => path.setAttribute(k, v));

      const dx = p[0] - pts[0][0], dy = p[1] - pts[0][1];

      else { const ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4), r = Math.hypot(dx, dy); p = [pts[0][0] + r * Math.cos(ang), pts[0][1] + r * Math.sin(ang)]; }

/* ================= viewing files (Quick Look in the Mac app) ================= */

async function openViewer(c) {
  const src = await Store.src(c); if (!src) return;
  const v = document.createElement('div'); v.className = 'viewer';
  const body = c.type === 'image' ? `<img src="${esc(src)}" alt="">`
    : c.type === 'video' ? `<video src="${esc(src)}" controls autoplay playsinline></video>`
    : (c.mime === 'application/pdf' || /^text\//.test(c.mime || '')) ? `<iframe src="${esc(src)}" title="${esc(c.name)}"></iframe>`
    : `<div style="color:#fff;text-align:center">No preview for .${esc(c.ext)} files here.<br><br><button class="btn" data-open>Open</button></div>`;
  v.innerHTML = `${body}<button class="vclose" aria-label="Close">✕</button><div class="vname">${esc(clipName(c))}</div>`;
  document.body.appendChild(v);
  const close = () => { v.remove(); removeEventListener('keydown', key, true); };
  const key = e => { if (e.key === 'Escape' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); close(); } };
  addEventListener('keydown', key, true);
  v.addEventListener('click', e => { if (e.target === v || e.target.closest('.vclose')) close(); if (e.target.closest('[data-open]')) { close(); openClip(c); } });
}

/* ================= plugins =================
   A plugin is a folder with plugin.json + main.js. main.js runs with one argument, `recol` — the whole API.
   See PLUGINS.md. Plugins run inside Recol with the same access as Recol itself, so only install ones you trust. */
const plugins = [];

    // ── read ──
    boards: () => state.boards.map(b => ({ id: b.id, name: b.name, mood: !!b.mood, clips: b.clips.length, current: b === board })),
    board: () => ({ id: board.id, name: board.name, mood: !!board.mood, view: board.view, sticky: !!board.sticky }),
    clips: ref => need(ref).clips.map(snap0),

    markdown: ref => boardMarkdown(need(ref)),
    // ── change ──

    addText: async (t, o = {}) => (await addText(String(t), o.at, need(o.board)))?.id,

    select: ids => setSel([].concat(ids || [])),
    openBoard: ref => { const b = need(ref); switchBoard(b.id); },

}
const commands = {
  newBoard: () => newBoard(), newMood: () => newBoard(null, true), addFiles: () => $('#filePick').click(), import: () => $('#importPick').click(), share,
  'view-free': () => setView('free'), 'view-grid': () => setView('grid'), 'view-list': () => setView('list'),
  organize: toggleOrganize, lineup: () => { setView('free'); lineUp(); }, settings: openSettings,
  toggleSticky: toggleStickySelection, design: () => { if (!board.mood) { board.mood = true; save(); render(); } setDesign(!designMode); },
  group: groupSelection, ungroup: ungroupSelection, home: () => toggleHome(), pdf: () => exportPDF(), snapshot: () => saveSnapshot(),
  rename: () => { const cs = selClips(); if (cs.length === 1 && !isShape(cs[0])) renameClip(cs[0]); },
  look: () => sel.size && previewClips(selClips()), selectAll: () => setSel(shown().filter(matches).map(c => c.id)),
  newNote: () => newNote(), zoomIn: () => zoomBy(1.25), zoomOut: () => zoomBy(0.8), zoomReset: () => zoomTo(1), zoomFit: () => zoomFit(),
  grid: () => { if (board.view !== 'free') setView('free'); board.grid = { '': 'dots', dots: 'lines', lines: undefined }[board.grid || '']; save(); applyCam(); if (orgOpen) renderOrganize(); toast(board.grid ? `Grid: ${board.grid}` : 'Grid off'); },
  snap: () => { board.snap = !board.snap || undefined; if (board.snap && !board.grid) board.grid = 'dots'; save(); applyCam(); if (orgOpen) renderOrganize(); toast(board.snap ? 'Snapping to grid' : 'Snapping off'); },
  copyMarkdown: () => copyMarkdown()
};
window.recolNative = {
  // The held clip(s) crossed the window edge and became a real macOS drag.
  dragOut() {
    const d = drag;
    if (!d) { if (lockedCarry) { outbound = lockedCarry; lockedCarry = null; } return; }
    outbound = d.carried;
    if (d.started) dropDrag(true); else drag = null;
    markOutbound();
  },
  // The macOS drag finished. Dropped somewhere → non-sticky clips leave Recol.
  dragEnded(ok) {
    const out = outbound || []; outbound = null;
    const leaving = ok ? out.filter(c => !isSticky(c)) : [];
    surface.querySelectorAll('.clip.out').forEach(n => n.classList.remove('out'));
    if (leaving.length) removeClips(leaving.map(c => c.id), { label: `Moved ${plural(leaving.length, 'clip')} out of Recol` });
    else if (ok) toast(out.length > 1 ? 'Dropped copies — sticky clips stay' : 'Dropped a copy — sticky clips stay');
  },
  // Files dropped from Finder, ⌃⌘C, or ⌘V of Finder files: the Mac side already copied or linked them.
  ingest(items, opts = {}) {
    canvas.classList.remove('dropping');
    const t = state.settings.quickTarget;
    let b = opts.current ? board : (state.boards.find(x => x.id === t) || board);
    if (opts.board) {   // from an AI or script, by clipboard name or id — made if it doesn't exist yet
      const want = String(opts.board).trim().toLowerCase();
      b = state.boards.find(x => x.id === opts.board || x.name.toLowerCase() === want);
      if (!b) { b = newBoardObj(String(opts.board).trim()); state.boards.push(b); save(); renderTabs(); }
    }
    let at = null;
    if (opts.at && b === board) at = toWorld(opts.at.x, opts.at.y);
    if (opts.from) setTimeout(() => toast(`${opts.from} added ${plural(items.length, 'clip')} to “${b.name}”`), 300);
    (async () => {
      for (const [i, it] of items.entries()) {
        if (it.file) await addStored(it.file, i === 0 ? at : null, b);
        else if (it.note) addClip({ type: 'text', text: String(it.note), color: DEFAULT_COLOR.text }, { w: 260, h: noteHeight(it.note) }, i === 0 ? at : null, b);
        else if (it.text) {
          const t = it.text.trim();
          if (!opts.current && b.clips.some(c => (c.text === t || c.url === t) && Date.now() - (c.added || 0) < 60000)) { toast('Already in Recol — saved just now'); continue; }
          await addText(it.text, i === 0 ? at : null, b);
        }
      }
    })();
    return b.name;
  },
  command(name) { commands[name] && commands[name](); },
  toast(m) { toast(String(m)); },
  previewClosed() { previewOpen = false; },
  async historyChanged() { if (histOpen) { histItems = (await call('history')) || []; renderHistory(); } },
  // Changes from an AI or script (via the inbox): rename, comment or recolor clips by id
  apply(ops, from) {
    let n = 0;
    for (const o of ops || []) {
      const f = findAny(o.id); if (!f) continue;
      for (const k of ['label', 'comment', 'color']) if (k in o) f.c[k] = o[k] === '' || o[k] == null ? undefined : String(o[k]);
      n++;
    }
    if (n) { save(); render(); toast(`${from || 'An app'} updated ${plural(n, 'clip')}`); }
    return n;
  },
  fullscreen(on) { document.documentElement.classList.toggle('fullscreen', on); },
  flush() { clearTimeout(saveT); return JSON.stringify(state); }
};

/* ================= boot ================= */
(async () => {
  const st = await Store.load();
  if (st && st.boards && st.boards.length) {
    state = st;
    for (const b of state.boards) {
      const all = [...(b.clips || b.items || []), ...(b.shapes || [])].filter(c => !(c.type === 'text' && !String(c.text || '').trim())); delete b.items;
      b.clips = all.filter(c => !isShape(c)); b.shapes = all.filter(isShape);
      b.view = b.view || 'free'; b.sort = b.sort || 'added'; b.dir = b.dir || 1;
      b.clips.forEach((c, i) => { c.added = c.added || (b.created || Date.now()) + i; c.order = c.order ?? i; if (c.type === 'file' && !c.color) c.color = DEFAULT_COLOR.file; });
    }
  } else state = { boards: [newBoardObj('My Clipboard')], current: null };
  state.settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
  state.tags ||= [];
  if (EXPORT) return exportMode();
  switchBoard(state.current);
  applySettings();
  document.fonts && document.fonts.ready.then(() => render());
  loadPlugins();
  if (NATIVE) call('gc', { keys: allKeys() });
})();
})();
</script>
